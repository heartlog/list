name: Update Providers JSON

on:
  schedule:
    # This cron syntax means "Run at minute 0 past every 12th hour"
    - cron: '0 */12 * * *'
  # This allows you to run it manually by clicking a button in the Actions tab
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    # Grants permission to the bot to push the updated JSON file back to the repo
    permissions:
      contents: write 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' 

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pycryptodomex

      - name: Run extraction script
        run: python script.py

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add providors.json
          # This checks if the JSON file actually changed before trying to commit
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update providors.json" && git push)
